healthcare_analytics:
  # Default target = BigQuery (GCP $900 credit). Fabric kept as legacy alt.
  target: bigquery
  outputs:
    bigquery:
      type: bigquery
      method: service-account   # headless SA key (no weekly ADC death); SA needs dataEditor+jobUser
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS', '/Users/anixlynch/.config/secrets/bchan-genai-deploy.json') }}"
      project: "{{ env_var('GCP_PROJECT_ID', 'bchan-genai-lab') }}"
      dataset: "{{ env_var('BQ_DATASET', 'healthcare_analytics') }}"
      location: "{{ env_var('BQ_LOCATION', 'US') }}"
      threads: 4
      priority: interactive
      job_execution_timeout_seconds: 300
      job_retries: 1
    dev:
      type: fabric
      driver: 'ODBC Driver 18 for SQL Server'
      server: "{{ env_var('FABRIC_SERVER', 'ndcddt2bpc6elclhiudkopyo5m-h7sh2v5uegpepgnw5j4pglsscy.datawarehouse.fabric.microsoft.com') }}"
      port: 1433
      database: "{{ env_var('FABRIC_DATABASE', 'HealthcareWarehouse') }}"
      schema: dbo
      authentication: CLI
      encrypt: true
      trust_cert: false
      retries: 3
      threads: 4
