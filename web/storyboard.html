<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Busy Day at the Hospital · healthcare-ai-data-engineer</title>
<style>
  :root{
    --cream:#FBF7F0; --paper:#FFFDF8; --ink:#2B2A27; --ink-soft:#6B675E;
    --line:#E7DFD1; --line-strong:#C9BCA2;
    --coral:#E8765B; --green:#5FA978; --green-deep:#2f6a45;
    --amber:#D4A23A; --red:#D9534F; --blue:#5B7FB9; --violet:#8b5cf6;
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,"Roboto Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--cream);color:var(--ink);font-family:var(--mono);
    line-height:1.55;-webkit-font-smoothing:antialiased;font-size:14px}
  .wrap{max-width:960px;margin:0 auto;padding:16px 16px 80px}
  a{color:inherit}

  header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 15px;
    background:var(--paper);border:2px solid var(--ink);border-radius:12px}
  .logo{font-weight:700;letter-spacing:-.3px}
  .logo .s{color:var(--coral)}
  .pill{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;
    border:1.5px solid var(--line-strong);background:var(--cream)}
  .pill.run{border-color:var(--blue);color:var(--blue);background:#fff}
  .sp{flex:1}
  .back{font-size:11.5px;color:var(--ink-soft);text-decoration:none;
    border-bottom:1.5px dashed var(--line-strong)}
  .back:hover{color:var(--coral);border-color:var(--coral)}

  h1.title{font-size:24px;margin:22px 0 6px;letter-spacing:-.5px}
  .subtitle{font-size:13px;color:var(--ink-soft);margin-bottom:18px;max-width:760px}

  /* Hero: Tommy + Eleanor side by side */
  .hero{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:10px}
  @media(max-width:680px){.hero{grid-template-columns:1fr}}
  .patient{background:var(--paper);border:2px solid var(--ink);border-radius:14px;
    padding:18px;display:flex;flex-direction:column}
  .patient.tommy{border-color:var(--amber)}
  .patient.eleanor{border-color:var(--green)}
  .p-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .p-emoji{font-size:30px;line-height:1}
  .p-name{font-size:18px;font-weight:700}
  .p-hook{font-size:12.5px;color:var(--ink-soft);font-style:italic;margin-bottom:12px}
  .p-steps{list-style:none;padding:0;margin:0 0 14px}
  .p-steps li{padding:6px 0;font-size:12.5px;border-bottom:1px dashed var(--line)}
  .p-steps li:last-child{border-bottom:none}
  .p-steps li::before{content:"↓ ";color:var(--line-strong);font-weight:700}
  .p-close{font-size:12.5px;color:var(--ink);margin-top:auto;padding-top:10px}
  .verdict{align-self:flex-start;font-size:12px;font-weight:700;padding:5px 14px;
    border-radius:999px;border:2px solid;margin-bottom:12px}
  .verdict.protected{background:#fef3e2;border-color:var(--amber);color:#8a6516}
  .verdict.helped{background:#e8f4ec;border-color:var(--green);color:var(--green-deep)}

  .section-label{font-size:12px;font-weight:700;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:.06em;margin:26px 0 12px}

  /* B1-B5 accordion */
  .stage{background:var(--paper);border:2px solid var(--line-strong);border-radius:12px;
    margin-bottom:10px;overflow:hidden;transition:border-color .15s}
  .stage.open{border-color:var(--ink)}
  .stage-head{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;
    user-select:none}
  .stage-head:hover{background:var(--cream)}
  .b-id{font-size:13px;font-weight:700;padding:4px 9px;border-radius:8px;color:#fff;flex-shrink:0}
  .b-id.b1{background:var(--green)} .b-id.b2{background:var(--amber)}
  .b-id.b3{background:var(--blue)} .b-id.b4{background:var(--coral)}
  .b-id.b5{background:var(--violet)}
  .stage-titles{flex:1;min-width:0}
  .stage-organ{font-size:14px;font-weight:700}
  .stage-q{font-size:11.5px;color:var(--ink-soft)}
  .chev{font-size:13px;color:var(--ink-soft);transition:transform .18s}
  .stage.open .chev{transform:rotate(90deg)}
  .stage-body{display:none;padding:0 16px 16px}
  .stage.open .stage-body{display:block}
  .stage-plain{font-size:12.5px;color:var(--ink-soft);font-style:italic;
    padding:10px 12px;background:var(--cream);border-radius:8px;
    border-left:3px solid var(--line-strong);margin:4px 0 12px}

  table.kv{width:100%;border-collapse:collapse;margin-bottom:12px}
  table.kv tr{border-bottom:1px solid var(--line)}
  table.kv tr:last-child{border-bottom:none}
  table.kv td{padding:7px 6px;vertical-align:middle}
  table.kv td.k{color:var(--ink-soft);font-size:12px;width:54%}
  table.kv td.v{font-size:15px;font-weight:700;text-align:right;white-space:nowrap}
  .proof{display:inline-block;font-size:10px;font-weight:700;margin-left:8px;
    padding:2px 7px;border-radius:6px;background:var(--cream);
    border:1px solid var(--line-strong);color:var(--ink-soft);text-decoration:none}
  .proof:hover{border-color:var(--coral);color:var(--coral)}
  .shot{width:100%;border:1.5px solid var(--line-strong);border-radius:8px;display:block;margin-bottom:8px}
  .api-link{font-size:11.5px;color:var(--blue);text-decoration:none;
    border-bottom:1.5px dashed var(--blue)}
  .api-link:hover{color:var(--coral);border-color:var(--coral)}

  /* Finale */
  .finale{background:var(--ink);color:var(--cream);border-radius:14px;
    padding:24px;text-align:center;margin-top:26px}
  .finale .fl{font-size:16px;font-weight:700;padding:7px 0}
  .finale .fl.dim{color:#cbb8a0;font-size:13px;font-weight:400;margin-top:6px}

  .evidence-note{font-size:11px;color:var(--ink-soft);margin:14px 0;
    padding:8px 12px;background:var(--paper);border:1.5px solid var(--line);border-radius:8px}
  .loading{text-align:center;padding:50px;color:var(--ink-soft)}
  footer{margin-top:24px;text-align:center;font-size:11.5px;color:var(--ink-soft)}
  footer .h{color:var(--coral)}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <span class="logo">healthcare-ai-data<span class="s">-engineer</span></span>
    <span class="pill run">● B1→B5 platform</span>
    <span class="sp"></span>
    <a class="back" href="/app">← cockpit</a>
    <a class="back" href="https://gozeroshot.dev" style="margin-left:12px">gozeroshot.dev ↗</a>
  </header>

  <div id="root"><div class="loading">Reading live artifacts…</div></div>

  <footer>Built by <span class="h">Anix Lynch</span> · every metric reads a committed artifact at request time · <span id="repolink"></span></footer>
</div>

<script>
const root = document.getElementById('root');

function metricRow(m){
  const proof = m.proof ? `<a class="proof" href="${m.proof}" target="_blank" rel="noopener">proof ↗</a>` : '';
  return `<tr><td class="k">${m.label}<br><span style="font-size:10px;opacity:.7">${m.source}</span></td>
          <td class="v">${m.value}${proof}</td></tr>`;
}

function stageBlock(s){
  const rows = s.metrics.map(metricRow).join('');
  const shot = s.screenshot ? `<img class="shot" loading="lazy" src="${s.screenshot}" alt="${s.organ} screenshot"
       onerror="this.style.display='none'">` : '';
  const api = s.api ? `<div>▶ live: <a class="api-link" href="${s.api}" target="_blank" rel="noopener">${s.api}</a></div>` : '';
  return `<div class="stage" data-id="${s.id}">
    <div class="stage-head" onclick="this.parentNode.classList.toggle('open')">
      <span class="b-id ${s.dot}">${s.id}</span>
      <span class="stage-titles"><span class="stage-organ">${s.organ}</span><br>
        <span class="stage-q">${s.question}</span></span>
      <span class="chev">▶</span>
    </div>
    <div class="stage-body">
      <div class="stage-plain">${s.plain}</div>
      <table class="kv">${rows}</table>
      ${shot}
      ${api}
    </div>
  </div>`;
}

function patientCard(p, cls){
  const steps = p.steps.map(s=>`<li>${s}</li>`).join('');
  const vcls = p.verdict === 'PROTECTED' ? 'protected' : 'helped';
  return `<div class="patient ${cls}">
    <div class="p-head"><span class="p-emoji">${p.emoji}</span><span class="p-name">${p.name}</span></div>
    <div class="p-hook">"${p.hook}"</div>
    <span class="verdict ${vcls}">💙 ${p.verdict}</span>
    <ul class="p-steps">${steps}</ul>
    <div class="p-close">${p.close}</div>
  </div>`;
}

fetch('/api/storyboard/platform').then(r=>r.json()).then(d=>{
  document.getElementById('repolink').innerHTML =
    `<a class="back" href="${d.repo}" target="_blank" rel="noopener">source ↗</a>`;
  const stages = d.stages.map(stageBlock).join('');
  const finale = d.finale.map((f,i)=>`<div class="fl${i===2?' dim':''}">${f}</div>`).join('');
  root.innerHTML = `
    <h1 class="title">${d.title}</h1>
    <div class="subtitle">${d.subtitle}</div>
    <div class="hero">
      ${patientCard(d.tommy,'tommy')}
      ${patientCard(d.eleanor,'eleanor')}
    </div>
    <div class="evidence-note">📎 Evidence-first: every number below is read live from a committed JSON / report artifact. Click <b>proof ↗</b> on any metric to see the source file on GitHub.</div>
    <div class="section-label">The platform, stage by stage — click to expand</div>
    ${stages}
    <div class="finale">${finale}</div>`;
  // open B1 by default
  const first = root.querySelector('.stage');
  if(first) first.classList.add('open');
}).catch(e=>{
  root.innerHTML = `<div class="loading">Could not load platform data: ${e}</div>`;
});
</script>
</body>
</html>
