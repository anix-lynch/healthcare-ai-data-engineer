name: freshness-watchdog
# Independently scheduled self-healing watchdog (Reliability branch). Runs on its
# OWN cadence, separate from the primary openfda-pipeline DAG, so it can detect a
# missed/stale end-to-end run even if the primary pipeline never starts. On a stale
# detection it invokes the SAME canonical runner (run_pipeline.py) with bounded
# retries, verifies recovery, and escalates unrecoverable incidents. Needs GCP_SA_KEY.
on:
  schedule:
    - cron: "30 */6 * * *"   # every 6h, offset 30min from the daily 06:00 primary DAG
  workflow_dispatch: {}
env:
  GCP_PROJECT_ID: bchan-genai-lab
  BQ_DATASET: healthcare_analytics
  BQ_LOCATION: US
jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install deps
        run: pip install --quiet google-cloud-bigquery pandas great_expectations dbt-bigquery
      - name: Auth (deploy SA key, machine identity)
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > /tmp/sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json" >> "$GITHUB_ENV"
      - name: Watchdog — detect stale / bounded recover / verify / escalate
        run: python ingestion/watchdog.py --scenario scheduled --max-attempts 3 --base-backoff 5
      - name: Upload watchdog + escalation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freshness-watchdog-${{ github.run_number }}
          path: |
            data/quality/freshness_watchdog_*.json
            data/quality/freshness_escalation_*.json
            data/freshness/last_successful_e2e.json
