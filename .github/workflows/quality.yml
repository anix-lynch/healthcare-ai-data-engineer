name: data-quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checkpoint-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r api/requirements.txt

      # Layer 1 lightweight quality gate — 7 checks against the
      # enriched 497-row corpus. Exit 1 on any critical failure.
      - name: make checkpoint
        run: make checkpoint

      # pytest suite — checkpoint integrity + identity map shape
      # + FastAPI endpoint smoke (no real LLM, no network)
      - name: make test
        run: make test

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l1-quality-report
          path: data/quality/l1_checkpoint_report.json
          retention-days: 30
