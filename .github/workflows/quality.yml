name: data-quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checkpoint-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r api/requirements.txt
          pip install -r scripts/requirements-quality.txt

      # Release gate — validates all 55,500 source rows before promotion,
      # then validates the AI-facing enriched slice. Exit 1 blocks release.
      - name: Great Expectations release gates
        run: python scripts/run_ge.py

      # Warehouse contract tests: uniqueness, relationships, accepted values,
      # and domain assertions. Uses the committed service-account profile in
      # live warehouse runs; CI validates the project structure offline here.
      - name: Validate dbt project
        run: |
          pip install dbt-core dbt-bigquery
          cd dbt-project
          dbt parse --profiles-dir .

      # Healthcare-specific guards complement GE: PII, identity, temporal sanity.
      - name: make checkpoint
        run: make checkpoint

      # pytest suite — checkpoint integrity + identity map shape
      # + FastAPI endpoint smoke (no real LLM, no network)
      - name: make test
        run: make test

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l1-quality-report
          path: |
            data/quality/ge_release_gate_report.json
            data/quality/l1_checkpoint_report.json
          retention-days: 30
